<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聆听 MUSIC</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#070a14;
    --ink:#f4f6fb;
    --ink-2:rgba(235,240,250,.72);
    --ink-3:rgba(235,240,250,.45);
    --gold:#f5b83d;
    --gold-2:#ffcf6b;
    --glass:linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.045));
    --stroke:rgba(255,255,255,.13);
    --stroke-soft:rgba(255,255,255,.08);
    --blur:blur(22px) saturate(160%);
    --shadow:0 18px 44px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.14);
    --r-lg:22px; --r-md:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:"Manrope","Noto Sans SC",sans-serif}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible, a:focus-visible, input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  img{display:block}
  ::selection{background:rgba(245,184,61,.35)}

  /* ---------- ambient backdrop ---------- */
  .ambient{position:fixed;inset:0;z-index:0;overflow:hidden;background:
    radial-gradient(1100px 700px at 85% -10%, #1c2f52 0%, transparent 60%),
    radial-gradient(900px 650px at -10% 100%, #33200f 0%, transparent 55%),
    var(--bg)}
  .ambient img{position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;
    filter:blur(90px) saturate(150%) brightness(.62);opacity:.55;transition:opacity .8s ease}
  .ambient .veil{position:absolute;inset:0;background:
    radial-gradient(120% 90% at 50% 0%, transparent 40%, rgba(4,6,12,.55) 100%),
    linear-gradient(180deg, rgba(5,7,13,.25), rgba(5,7,13,.55))}
  .glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;transition:background 1s ease}
  .glow-a{width:480px;height:480px;left:-120px;top:32%;background:#7a2d16}
  .glow-b{width:420px;height:420px;right:-100px;top:-120px;background:#173d5c}

  /* ---------- layout ---------- */
  .app{position:relative;z-index:1;display:grid;grid-template-columns:236px minmax(0,1fr);
    height:100dvh;padding:14px 14px 108px;gap:14px}
  .glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
    border:1px solid var(--stroke);border-radius:var(--r-lg);box-shadow:var(--shadow)}

  /* ---------- sidebar ---------- */
  .sidebar{display:flex;flex-direction:column;padding:20px 14px 16px;min-height:0}
  .brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px;user-select:none;-webkit-app-region:drag}
  .brand-mark{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;
    background:linear-gradient(140deg,#ffd97a,#f0a92e 55%,#d98a12);color:#231600;
    font-weight:900;font-size:20px;box-shadow:0 8px 20px rgba(240,169,46,.35), inset 0 1px 0 rgba(255,255,255,.6)}
  .brand b{font-size:19px;letter-spacing:.14em;display:block;line-height:1.1}
  .brand span{font-family:"Manrope",sans-serif;font-size:10px;letter-spacing:.42em;color:var(--ink-3);font-weight:700}
  .nav-group{margin-bottom:18px}
  .nav-label{font-size:11px;letter-spacing:.18em;color:var(--ink-3);padding:0 10px 8px;font-weight:500}
  .nav-item{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;padding:0 12px;
    border-radius:12px;color:var(--ink-2);font-size:14.5px;font-weight:500;text-align:left;
    border:1px solid transparent;transition:background .18s,color .18s}
  .nav-item svg{width:19px;height:19px;flex:none;opacity:.85}
  .nav-item:hover{background:rgba(255,255,255,.06);color:var(--ink)}
  .nav-item.active{background:linear-gradient(120deg, rgba(245,184,61,.22), rgba(245,184,61,.08));
    border-color:rgba(245,184,61,.28);color:var(--gold-2)}
  .nav-item .count{margin-left:auto;font-size:11.5px;color:var(--ink-3);background:rgba(255,255,255,.07);
    border:1px solid var(--stroke-soft);min-width:24px;height:20px;padding:0 6px;border-radius:99px;
    display:inline-grid;place-items:center}
  .nav-item.active .count{color:var(--gold-2)}
  .side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;min-height:44px;
    background:rgba(255,255,255,.045);border:1px solid var(--stroke-soft);color:var(--ink-2);font-size:13.5px;width:100%;text-align:left}
  .side-foot:hover{background:rgba(255,255,255,.08);color:var(--ink)}
.side-foot.active{background:rgba(255,255,255,.09);color:var(--ink);box-shadow:inset 0 0 0 1px var(--stroke)}
  .side-foot svg{width:18px;height:18px}
  .side-foot .ver{margin-left:auto;font-size:11px;color:var(--ink-3)}

  /* ---------- main / topbar ---------- */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .topbar{position:relative;display:flex;align-items:center;gap:12px;padding:12px 16px;
    border-radius:var(--r-lg);flex:none;user-select:none}
  /* 原生拖拽热区：必须是不带 backdrop-filter 的独立图层。
     直接给 .topbar（玻璃层）设 -webkit-app-region:drag 时 Chromium 不会把
     命中转成 HTCAPTION，鼠标按住拖不动；套一层普通 div 就正常，且尺寸零漂移。 */
  .topbar>.drag-handle{position:absolute;inset:0;border-radius:inherit;z-index:0;-webkit-app-region:drag}
  .topbar>*:not(.drag-handle){position:relative;z-index:1}
  .topbar button,.topbar .search,.topbar .quality,.topbar input,.topbar .win-ctl{-webkit-app-region:no-drag}
  .tb-btn{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);
    background:rgba(255,255,255,.05);border:1px solid var(--stroke-soft);transition:.18s}
  .tb-btn:hover{background:rgba(255,255,255,.11);color:var(--ink)}
  .tb-btn svg{width:17px;height:17px}
  .tb-btn:disabled{opacity:.35;cursor:default}
  .search-wrap{position:relative;flex:1;max-width:520px;-webkit-app-region:no-drag}
  .search{display:flex;align-items:center;gap:9px;height:42px;padding:0 14px 0 16px;width:100%;
    border-radius:99px;background:rgba(6,9,17,.38);border:1px solid var(--stroke-soft);
    box-shadow:inset 0 2px 8px rgba(0,0,0,.35)}
  .search:focus-within{border-color:rgba(245,184,61,.42);box-shadow:inset 0 2px 8px rgba(0,0,0,.35),0 0 0 3px rgba(245,184,61,.09)}
  .search svg{width:17px;height:17px;color:var(--ink-3);flex:none}
  .search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font:inherit;font-size:14px}
  .search input::placeholder{color:var(--ink-3)}
  .search input::-webkit-search-cancel-button{display:none}
  .search-clear{display:none;width:18px;height:18px;flex:none;border-radius:50%;background:rgba(255,255,255,.13);
    color:var(--ink-2);font-size:11px;line-height:1;place-items:center}
  .search-wrap.has .search-clear{display:grid}
  .search-clear:hover{background:rgba(255,255,255,.24);color:#fff}

  /* 搜索历史下拉 */
  .search-drop{position:absolute;left:0;right:0;top:calc(100% + 9px);z-index:80;padding:15px 16px 14px;
    border-radius:18px;display:none;
    background:linear-gradient(135deg,rgba(26,31,45,.97),rgba(13,16,25,.99));
    border:1px solid var(--stroke);box-shadow:0 26px 56px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(24px) saturate(160%)}
  .search-drop.show{display:block}
  .sd-head{display:flex;align-items:center;margin-bottom:12px}
  .sd-head b{font-size:12.5px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
  .sd-head button{margin-left:auto;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
  .sd-head button:hover{color:var(--ink)}
  .sd-head button svg{width:14px;height:14px}
  .sd-tags{display:flex;flex-wrap:wrap;gap:9px}
  .sd-tag{height:33px;max-width:100%;padding:0 13px;border-radius:10px;font-size:12.5px;color:var(--ink-2);
    background:rgba(255,255,255,.06);border:1px solid var(--stroke-soft);transition:.16s;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .sd-tag:hover{background:rgba(255,255,255,.13);color:var(--ink);border-color:rgba(245,184,61,.34)}
  .sd-empty{font-size:12.5px;color:var(--ink-3);padding:2px 0 4px}

  /* 音质选择浮层 */
  .qpop{position:fixed;z-index:90;min-width:208px;padding:8px;border-radius:16px;display:none;
    background:linear-gradient(135deg,rgba(26,31,45,.98),rgba(13,16,25,.99));
    border:1px solid var(--stroke);box-shadow:0 26px 56px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(24px) saturate(160%)}
  .qpop.show{display:block;animation:qin .16s ease}
  @keyframes qin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .qpop .qp-head{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);
    padding:6px 10px 8px;text-transform:uppercase}
  .qopt{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:11px;text-align:left;transition:.14s}
  .qopt:hover{background:rgba(255,255,255,.08)}
  .qopt .qn{min-width:0;flex:1}
  .qopt .qn b{display:block;font-size:13px;font-weight:700;color:var(--ink)}
  .qopt .qn small{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
  .qopt .qk{width:16px;height:16px;flex:none;color:var(--gold);opacity:0}
  .qopt.on{background:linear-gradient(120deg, rgba(245,184,61,.18), rgba(245,184,61,.05))}
  .qopt.on .qn b{color:var(--gold-2)}
  .qopt.on .qk{opacity:1}

  /* 倍速浮层：六档网格 */
  .spop{min-width:206px}
  .sp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:2px}
  .sp-opt{height:34px;border-radius:10px;font-family:"Manrope",sans-serif;font-size:12.5px;font-weight:700;
    color:var(--ink-2);background:rgba(255,255,255,.05);transition:.14s}
  .sp-opt:hover{background:rgba(255,255,255,.12);color:var(--ink)}
  .sp-opt.on{background:linear-gradient(120deg, rgba(245,184,61,.20), rgba(245,184,61,.06));
    color:var(--gold-2);box-shadow:inset 0 0 0 1px rgba(245,184,61,.38)}

  /* 搜索结果分组 */
  .sr-tabs{display:flex;gap:30px;margin:0 2px 18px;border-bottom:1px solid var(--stroke-soft)}
  .sr-tab{position:relative;padding:0 2px 12px;font-size:15px;font-weight:700;color:var(--ink-3);transition:.16s}
  .sr-tab:hover{color:var(--ink-2)}
  .sr-tab.on{color:var(--gold-2)}
  .sr-tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;border-radius:99px;
    background:linear-gradient(90deg,var(--gold-2),#e08e12);box-shadow:0 0 10px rgba(245,184,61,.6)}
  .sr-tab .n{font-size:11.5px;font-weight:500;color:var(--ink-3);margin-left:6px}
  .sr-tab.on .n{color:rgba(245,184,61,.75)}

  /* 歌单卡片 */
  .pl-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:16px}
  .pl-card{text-align:left;padding:10px;border-radius:18px;background:var(--glass);border:1px solid var(--stroke-soft);
    box-shadow:0 10px 26px rgba(0,0,0,.28);transition:.2s}
  .pl-card:hover{transform:translateY(-2px);border-color:rgba(245,184,61,.3);box-shadow:0 16px 34px rgba(0,0,0,.42)}
  .pl-card .cov{position:relative;width:100%;aspect-ratio:1/1;border-radius:13px;overflow:hidden;
    background:linear-gradient(140deg,#2b3550,#131826);display:grid;place-items:center}
  .pl-card .cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .pl-card .cov .pl-txt{font-size:26px;font-weight:900;color:rgba(255,255,255,.28)}
  .pl-card .cov .pl-n{position:absolute;left:0;right:0;bottom:0;padding:18px 9px 7px;font-size:11px;
    color:#fff;display:flex;align-items:center;gap:4px;
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.72))}
  .pl-card .cov .pl-n svg{width:12px;height:12px}
  .pl-card b{display:block;margin:9px 2px 3px;font-size:13.5px;font-weight:700;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pl-card span.meta{display:block;margin:0 2px;font-size:11.5px;color:var(--ink-3);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 歌单详情头 */
  .pl-hero{display:flex;gap:20px;padding:18px;border-radius:20px;margin-bottom:22px}
  .pl-hero .cov{width:150px;height:150px;flex:none;border-radius:16px;overflow:hidden;position:relative;
    background:linear-gradient(140deg,#2b3550,#131826);display:grid;place-items:center}
  .pl-hero .cov span{font-size:38px;font-weight:900;color:rgba(255,255,255,.25)}
  .pl-hero .cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
  .pl-hero .txt{min-width:0;display:flex;flex-direction:column;justify-content:center}
  .pl-hero h1{font-size:22px;font-weight:900;line-height:1.3;margin-bottom:8px}
  .pl-hero .who{font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
  .pl-hero .desc{font-size:12px;color:var(--ink-3);line-height:1.7;max-height:44px;overflow:hidden}
  .quality{margin-left:auto;display:flex;align-items:center;gap:8px;height:38px;padding:0 15px;flex:none;
    border-radius:99px;font-size:13px;color:var(--gold-2);
    background:linear-gradient(120deg, rgba(245,184,61,.16), rgba(245,184,61,.05));
    border:1px solid rgba(245,184,61,.3)}
  .quality i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
  .win-ctl{display:flex;align-items:center;gap:6px;margin-left:2px}
  .win-ctl .tb-btn{width:32px;height:32px}
  .win-ctl .tb-btn svg{width:13px;height:13px}
  .win-ctl .tb-btn.close:hover{background:rgba(255,93,115,.85);color:#fff;border-color:transparent}

  .content{flex:1;overflow-y:auto;padding:22px 12px 10px 6px}
  /* 统一深色细滚动条：一旦写 scrollbar-width，Chromium 会退回系统浅色 Fluent 滚动条，
     所以这里只用 ::-webkit-scrollbar，所有滚动容器同一个宽度和同一个颜色。 */
  .content::-webkit-scrollbar{width:8px;height:8px}
  .content::-webkit-scrollbar-track{background:transparent}
  .content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
  .content::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28);background-clip:padding-box}
  .content::-webkit-scrollbar-corner{background:transparent}

  .sec-head{display:flex;align-items:center;gap:12px;margin:4px 2px 16px}
  .sec-head::before{content:"";width:4px;height:20px;border-radius:99px;background:linear-gradient(180deg,var(--gold-2),#e08e12);
    box-shadow:0 0 12px rgba(245,184,61,.55)}
  .sec-head h2{font-size:21px;font-weight:900;letter-spacing:.02em}
  .sec-head .more{margin-left:auto;font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:3px;padding:8px 4px;min-height:36px}
  .sec-head .more:hover{color:var(--ink)}
  .sec-sub{font-size:12.5px;color:var(--ink-3);margin:-8px 2px 14px}
  .play-all{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 16px;border-radius:99px;
    background:linear-gradient(140deg,#ffd97a,#efa92c);color:#2a1a00;font-weight:700;font-size:13.5px;
    box-shadow:0 8px 20px rgba(240,169,46,.32)}
  .play-all:hover{filter:brightness(1.06)}
  .play-all svg{width:13px;height:13px}

  /* ---------- chart cards ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:16px;margin-bottom:30px}
  .card{position:relative;border-radius:var(--r-md);overflow:hidden;text-align:left;padding:0;
    border:1px solid var(--stroke-soft);background:rgba(255,255,255,.04);
    box-shadow:0 14px 30px rgba(0,0,0,.35);transition:transform .22s ease, box-shadow .22s ease}
  .card:hover{transform:translateY(-4px);box-shadow:0 22px 40px rgba(0,0,0,.5)}
  .card .cover{position:relative;aspect-ratio:16/10;overflow:hidden}
  .card .cover img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
  .card:hover .cover img{transform:scale(1.06)}
  .card .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(5,8,14,.55))}
  .card .cover .ch{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:56px;color:rgba(255,255,255,.22)}
  .tag{position:absolute;top:10px;left:10px;z-index:2;font-size:11px;font-weight:700;color:#ffe9b0;
    background:rgba(20,14,2,.55);border:1px solid rgba(255,217,122,.4);padding:4px 9px;border-radius:7px;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .card .go{position:absolute;right:12px;bottom:12px;z-index:2;width:40px;height:40px;border-radius:50%;
    display:grid;place-items:center;background:linear-gradient(140deg,#ffd97a,#efa92c);color:#2a1a00;
    box-shadow:0 10px 22px rgba(240,169,46,.4);opacity:0;transform:translateY(6px);transition:.22s}
  .card:hover .go,.card:focus-visible .go{opacity:1;transform:none}
  .card .go svg{width:15px;height:15px;margin-left:2px}
  .card .meta{padding:13px 15px 15px;background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02))}
  .card .meta b{font-size:16.5px;font-weight:800;display:block}
  .card .meta span{font-size:12.5px;color:var(--ink-3);display:block;margin-top:4px}

  /* ---------- song list panel ---------- */
  .panel{border-radius:var(--r-lg);padding:8px 10px 10px}
  .thead,.row{display:grid;grid-template-columns:44px minmax(0,1.9fr) minmax(0,1.2fr) 64px 92px;align-items:center;gap:10px;padding:0 12px}
  .thead{height:38px;font-size:12.5px;color:var(--ink-3);border-bottom:1px solid var(--stroke-soft)}
  .thead .r{text-align:right}
  .row{min-height:64px;border-radius:14px;border:1px solid transparent;cursor:pointer;transition:background .16s}
  .row:hover{background:rgba(255,255,255,.055)}
  .row.selected{background:rgba(245,184,61,.10);border-color:rgba(245,184,61,.30)}
  .row.playing{background:linear-gradient(120deg, rgba(255,255,255,.09), rgba(255,255,255,.03));border-color:var(--stroke-soft)}
  .row.playing.selected{background:linear-gradient(120deg, rgba(245,184,61,.18), rgba(245,184,61,.06));border-color:rgba(245,184,61,.34)}
  .row .idx{font-size:15px;color:var(--ink-3);font-weight:700;text-align:center}
  .row.playing .idx{color:var(--gold-2)}
  .eq{display:none;align-items:flex-end;gap:2.5px;height:15px;justify-content:center}
  .eq i{width:3px;border-radius:2px;background:var(--gold);animation:eq 0.9s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
  @keyframes eq{0%,100%{height:5px}50%{height:15px}}
  .row.playing .eq{display:flex}.row.playing .idx-num{display:none}
  body.paused .eq i{animation-play-state:paused}
  .song{display:flex;align-items:center;gap:13px;min-width:0}
  .song .cwrap{width:46px;height:46px;border-radius:10px;overflow:hidden;position:relative;flex:none;
    box-shadow:0 6px 14px rgba(0,0,0,.4)}
  .song .cwrap .cch{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:rgba(255,255,255,.9);
    font-size:17px}
  .song .cwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s ease}
  .song .t{min-width:0}
  .song .t b{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
  .song .t b .tt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .song .t b .hq{flex:none}
  .song .t span{font-size:12.5px;color:var(--ink-3);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hq{font-family:"Manrope",sans-serif;font-size:9.5px;font-weight:800;letter-spacing:.06em;color:#8fd8ff;
    border:1px solid rgba(143,216,255,.45);border-radius:4px;padding:1px 4px;flex:none}
  .hq.flac{color:var(--gold-2);border-color:rgba(245,184,61,.5)}
  .album{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dur{font-size:13px;color:var(--ink-3);text-align:right}
  .ops{display:flex;justify-content:flex-end;gap:4px}
  .op-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);transition:.16s}
  .op-btn:hover{background:rgba(255,255,255,.1);color:var(--ink)}
  .op-btn svg{width:18px;height:18px}
  .op-btn.liked{color:#ff5d73}
  .empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:14px}
  .empty b{display:block;color:var(--ink-2);font-size:15px;font-weight:700;margin-bottom:6px}
  .empty .btn{margin-top:14px;display:inline-flex;align-items:center;height:34px;padding:0 16px;border-radius:99px;
    background:rgba(245,184,61,.14);border:1px solid rgba(245,184,61,.28);color:var(--gold-2);font-size:12.5px}
  .empty .btn:hover{background:rgba(245,184,61,.24)}

  /* chips / load more / podium */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;-ms-overflow-style:none}
  .chips::-webkit-scrollbar{height:0;display:none}
  .chips::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:99px}
  .chip{flex:none;height:34px;padding:0 14px;border-radius:99px;font-size:12.5px;color:var(--ink-2);
    background:rgba(255,255,255,.045);border:1px solid var(--stroke-soft);transition:.16s}
  .chip:hover{background:rgba(255,255,255,.09);color:var(--ink)}
  .chip.on{background:linear-gradient(140deg,#ffd97a,#efa92c);color:#2a1a00;font-weight:700;border-color:transparent;
    box-shadow:0 8px 18px rgba(240,169,46,.3)}
  .loadmore{display:flex;justify-content:center;padding:16px 0 4px}
  .loadmore button{height:38px;padding:0 22px;border-radius:99px;background:rgba(255,255,255,.06);
    border:1px solid var(--stroke-soft);font-size:12.5px;color:var(--ink-2)}
  .loadmore button:hover{background:rgba(255,255,255,.12);color:var(--ink)}
  .podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}
  .pod{display:flex;align-items:center;gap:13px;padding:12px;border-radius:16px;cursor:pointer;
    background:rgba(255,255,255,.045);border:1px solid var(--stroke-soft);transition:.18s;min-width:0}
  .pod:hover{background:rgba(255,255,255,.09);border-color:rgba(245,184,61,.3)}
  .pod .cw{width:56px;height:56px;border-radius:12px;overflow:hidden;position:relative;flex:none}
  .pod .cw .cch{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:#fff;font-size:19px}
  .pod .cw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
  .pod .no{font-family:"Manrope",sans-serif;font-size:11px;font-weight:800;color:var(--gold-2);letter-spacing:.06em}
  .pod b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pod span{display:block;font-size:12px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* settings blocks */
  .set-block{border-radius:var(--r-lg);padding:18px 20px;margin-bottom:14px}
  .set-block h3{font-size:14.5px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .set-block h3::before{content:"";width:3px;height:14px;border-radius:99px;background:var(--gold)}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0}
  .set-row+.set-row{border-top:1px solid var(--stroke-soft)}
  .set-row p{font-size:13.5px;color:var(--ink)}
  .set-row small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px}
  .path{font-family:"Manrope",monospace;font-size:12px;color:var(--ink-2);word-break:break-all;
    background:rgba(4,7,13,.45);border:1px solid var(--stroke-soft);border-radius:10px;padding:9px 12px;margin-top:8px}
  .qseg{display:flex;gap:8px;flex-wrap:wrap}
  .qseg button{flex:1;min-width:130px;text-align:left;padding:11px 13px;border-radius:12px;
    background:rgba(255,255,255,.04);border:1px solid var(--stroke-soft);transition:.16s}
  .qseg button:hover{background:rgba(255,255,255,.08)}
  .qseg button.on{background:linear-gradient(120deg, rgba(245,184,61,.2), rgba(245,184,61,.06));border-color:rgba(245,184,61,.4)}
  .qseg b{display:block;font-size:13px;color:var(--ink);font-weight:700}
  .qseg button.on b{color:var(--gold-2)}
  .qseg span{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
  .mini{height:32px;padding:0 13px;border-radius:99px;font-size:12px;background:rgba(255,255,255,.06);
    border:1px solid var(--stroke-soft);color:var(--ink-2)}
  .mini:hover{background:rgba(255,255,255,.12);color:var(--ink)}
  .mini.gold{background:rgba(245,184,61,.16);border-color:rgba(245,184,61,.3);color:var(--gold-2)}
  .mini.gold:hover{background:rgba(245,184,61,.26)}
  .mini.danger{background:rgba(255,93,115,.12);border-color:rgba(255,93,115,.28);color:#ff8b9c}
  .mini.danger:hover{background:rgba(255,93,115,.22)}
  .switch{width:44px;height:24px;border-radius:99px;position:relative;background:rgba(255,255,255,.15);transition:.2s;flex:none}
  .switch.on{background:linear-gradient(140deg,#ffd97a,#efa92c)}
  .switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.4);transition:.2s}
  .switch.on i{left:23px}
  .lib-row{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px}
  .lib-row:hover{background:rgba(255,255,255,.05)}
  .lib-row .cw{width:44px;height:44px;border-radius:10px;overflow:hidden;position:relative;flex:none}
  .lib-row .cw .cch{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:#fff}
  .lib-row .cw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
  .lib-row .nm{min-width:0;flex:1}
  .lib-row .nm b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lib-row .nm span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- player bar ---------- */
  .player{position:fixed;left:14px;right:14px;bottom:14px;z-index:5;border-radius:20px;padding:0 18px 0 14px;
    display:grid;grid-template-columns:minmax(0,1.1fr) auto minmax(0,1.1fr);align-items:center;gap:14px;height:82px}
  .progress{position:absolute;left:18px;right:18px;top:-5px;height:14px;display:flex;align-items:center;cursor:pointer;touch-action:none}
  .progress .rail{position:relative;width:100%;height:4px;border-radius:99px;background:rgba(255,255,255,.16)}
  .progress .fill{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--gold-2),#efa92c);box-shadow:0 0 10px rgba(245,184,61,.5)}
  .progress .knob{position:absolute;top:50%;left:0%;width:12px;height:12px;border-radius:50%;background:#fff;
    transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.5);opacity:0;transition:opacity .15s}
  .progress:hover .knob,.progress:active .knob{opacity:1}
  .now{display:flex;align-items:center;gap:13px;min-width:0}
  .now .disc{width:54px;height:54px;border-radius:50%;flex:none;overflow:hidden;position:relative;
    border:2px solid rgba(255,255,255,.25);box-shadow:0 8px 18px rgba(0,0,0,.45);background:#10131c}
  .now .disc .cch{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:#fff;font-size:19px}
  .now .disc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    animation:spin 14s linear infinite;animation-play-state:paused;opacity:0;transition:opacity .3s}
  body.playing .now .disc img{animation-play-state:running}
  .now .disc::after{content:"";position:absolute;inset:0;margin:auto;width:13px;height:13px;border-radius:50%;
    background:#0a0e18;border:2px solid rgba(255,255,255,.5);z-index:2}
  @keyframes spin{to{transform:rotate(360deg)}}
  .now .t{min-width:0}
  .now .t b{font-size:15.5px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now .t span{font-size:12.5px;color:var(--ink-3);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .controls{display:flex;align-items:center;gap:6px}
  .ctl{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);transition:.16s}
  .ctl:hover{background:rgba(255,255,255,.09);color:var(--ink)}
  .ctl svg{width:20px;height:20px}
  .ctl.on{color:var(--gold-2)}
  .play-btn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin:0 4px;
    background:linear-gradient(140deg,#ffd97a,#efa92c);color:#2a1a00;
    box-shadow:0 10px 24px rgba(240,169,46,.42), inset 0 1px 0 rgba(255,255,255,.65);transition:.16s}
  .play-btn:hover{filter:brightness(1.07)}
  .play-btn svg{width:21px;height:21px}
  .time{font-size:12.5px;color:var(--ink-3);min-width:86px;text-align:center}
  .side-ctl{display:flex;align-items:center;gap:6px;justify-content:flex-end}
  /* 音质 / 倍速 与圆形控制键统一成同一套胶囊型，高度一致 */
  .flac{font-family:"Manrope",sans-serif;font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--gold-2);
    border:1px solid rgba(245,184,61,.45);border-radius:99px;padding:0 12px;height:28px;min-width:52px;
    display:grid;place-items:center;transition:.16s;background:rgba(245,184,61,.08)}
  .flac:hover{background:rgba(245,184,61,.2)}
  .speed{font-family:"Manrope",sans-serif;font-size:12px;font-weight:700;color:var(--ink-2);height:28px;min-width:48px;
    padding:0 12px;border-radius:99px;display:grid;place-items:center;
    background:rgba(255,255,255,.05);border:1px solid var(--stroke-soft);transition:.16s}
  .speed:hover{background:rgba(255,255,255,.11);color:var(--ink)}
  .queue-n{font-size:11px;color:var(--ink-3);white-space:nowrap}
  .vol{display:flex;align-items:center;gap:7px}
  .vol input[type=range]{width:92px;accent-color:var(--gold);height:20px;cursor:pointer}

  /* ---------- lyrics overlay ---------- */
  .lyrics{position:fixed;left:14px;right:14px;top:14px;bottom:108px;z-index:4;border-radius:var(--r-lg);
    display:grid;grid-template-columns:340px minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:0;overflow:hidden;padding:0;
    background-color:#0a0e17;
    transition:opacity .3s ease, transform .3s ease}
  .lyrics.hide{opacity:0;transform:translateY(14px);pointer-events:none}
  /* 环境层：当前封面放大到 124% + blur(90px) 当壁纸，叠暖金 glow 与压暗 veil（对齐毛玻璃版参考 .ambient） */
  .ly-amb{position:absolute;inset:0;z-index:0;overflow:hidden;border-radius:inherit;pointer-events:none;
    background:radial-gradient(1000px 640px at 84% -8%, #4a2c10 0%, transparent 62%),
      radial-gradient(820px 600px at -8% 104%, #3d1e08 0%, transparent 58%),
      radial-gradient(640px 460px at 52% 112%, #2a1606 0%, transparent 62%), #0a0e17}
  .ly-amb img{position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;
    filter:blur(90px) saturate(150%) brightness(.62);opacity:0;transition:opacity .6s ease}
  .ly-amb .veil{position:absolute;inset:0;
    background:radial-gradient(120% 90% at 50% 0%, transparent 40%, rgba(4,6,12,.55) 100%),
      linear-gradient(180deg, rgba(5,7,13,.25), rgba(5,7,13,.55))}
  .ly-amb .glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
  .ly-amb .ga{width:460px;height:460px;left:-110px;top:28%;background:#8a3d12}
  .ly-amb .gb{width:400px;height:400px;right:-90px;top:-110px;background:#6b3a10}
  .ly-left,.ly-right{position:relative;z-index:2}
  .ly-left{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:26px;
    border-right:1px solid var(--stroke-soft);min-width:0;min-height:0;overflow:hidden;
    background:linear-gradient(165deg, rgba(255,255,255,.07), rgba(255,255,255,.02) 58%, rgba(8,11,20,.20))}
  .ly-disc{width:100%;aspect-ratio:1;max-width:min(250px,34vh);border-radius:50%;overflow:hidden;position:relative;
    border:2px solid rgba(255,255,255,.2);box-shadow:0 20px 50px rgba(0,0,0,.55);background:#0b0f19;margin-bottom:22px}
  .ly-disc .cch{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:900;color:rgba(255,255,255,.75)}
  .ly-disc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    animation:spin 18s linear infinite;animation-play-state:paused;opacity:0;transition:opacity .4s}
  body.playing .ly-disc img{animation-play-state:running}
  .ly-disc::after{content:"";position:absolute;inset:0;margin:auto;width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%, #05070d 0 46%, rgba(255,255,255,.14) 47%, rgba(255,255,255,.04) 72%);
    box-shadow:inset 0 0 6px rgba(0,0,0,.9);z-index:2}
  .ly-left h3{font-size:19px;font-weight:900;margin-bottom:8px;word-break:break-word;text-align:center;line-height:1.35}
  .ly-left p{font-size:13px;color:var(--ink-3);line-height:1.6;text-align:center}
  .ly-tag{display:inline-flex;align-self:center;align-items:center;gap:6px;margin-top:14px;height:26px;padding:0 10px;border-radius:99px;
    font-size:11px;color:var(--gold-2);background:rgba(245,184,61,.14);border:1px solid rgba(245,184,61,.28)}
  .ly-right{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(90deg, rgba(8,11,20,.06), rgba(8,11,20,.34))}
  .ly-head{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;
    padding:16px 56px 12px;border-bottom:1px solid var(--stroke-soft)}
  .ly-head b{font-size:12.5px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px}
  .ly-head b::before{content:"";width:4px;height:16px;border-radius:99px;
    background:linear-gradient(180deg,var(--gold-2),#e08e12);box-shadow:0 0 12px rgba(245,184,61,.55)}
  .ly-close{position:absolute;right:18px;top:50%;transform:translateY(-50%);
    width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.07);border:1px solid var(--stroke-soft);color:var(--ink-2)}
  .ly-close:hover{background:rgba(255,255,255,.16);color:#fff}
  .ly-body{flex:1;min-height:0;overflow-y:auto;padding:18px 30px 36px;
    margin:12px 14px 14px;border-radius:var(--r-md);border:1px solid var(--stroke-soft);
    background:linear-gradient(135deg, rgba(255,255,255,.065), rgba(255,255,255,.022) 60%, rgba(255,255,255,.05));}
  .ly-body::-webkit-scrollbar{width:8px;height:8px}
  .ly-body::-webkit-scrollbar-track{background:transparent}
  .ly-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
  .ly-body::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28);background-clip:padding-box}
  .ly-meta{font-size:11.5px;line-height:1.9;color:rgba(235,240,250,.32);padding-bottom:16px;margin-bottom:16px;
    border-bottom:1px solid var(--stroke-soft);text-align:center;font-family:"Manrope","Noto Sans SC",sans-serif}
  /* --d = 与当前行的距离（JS 每帧写），用来做景深：越远越暗、越小 */
  .ly-line{font-size:16px;line-height:2;color:rgba(235,240,250,.42);cursor:pointer;
    text-align:center;padding:2px 10px;border-radius:10px;transform-origin:50% 50%;
    transform:scale(calc(1 - var(--d, 0) * .016));
    opacity:clamp(.14, calc(1 - var(--d, 0) * .155), 1);
    transition:transform .5s cubic-bezier(.2,.85,.3,1), opacity .45s ease,
      background-color .25s ease}
  .ly-line:hover{color:rgba(235,240,250,.85);opacity:1}
  .ly-line .ly-tx{display:inline}
  /* 逐字点亮：--p 由 JS 每帧写入，金色从 0 扫到 100%，未唱到的字保持暗色 */
  .ly-line.active{font-weight:700;color:rgba(235,240,250,.55);
    transform:scale(1.035);opacity:1;
    background:linear-gradient(90deg, transparent, rgba(245,184,61,.12) 18%, rgba(245,184,61,.12) 82%, transparent)}
  .ly-line.active .ly-tx{
    background-image:linear-gradient(90deg,
      var(--gold-2) 0, var(--gold-2) var(--p, 0%),
      rgba(235,240,250,.40) var(--p, 0%), rgba(235,240,250,.40) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 0 9px rgba(245,184,61,.30));
    animation:lyBreath 3.2s ease-in-out infinite}
  @keyframes lyBreath{
    0%,100%{opacity:.92}
    50%{opacity:1}
  }

  /* ---------- queue drawer ---------- */
  .queue{position:fixed;top:14px;right:14px;bottom:108px;width:360px;z-index:6;border-radius:var(--r-lg);
    display:flex;flex-direction:column;transform:translateX(calc(100% + 20px));transition:transform .32s cubic-bezier(.4,0,.2,1)}
  .queue.show{transform:none}
  .q-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--stroke-soft)}
  .q-head b{font-size:14.5px;font-weight:800}
  .q-head span{font-size:11.5px;color:var(--ink-3)}
  .q-close{margin-left:auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.06);border:1px solid var(--stroke-soft);color:var(--ink-2)}
  .q-close:hover{background:rgba(255,255,255,.15);color:#fff}
  .q-list{flex:1;overflow-y:auto;padding:8px 8px 14px}
  .q-list::-webkit-scrollbar{width:8px;height:8px}
  .q-list::-webkit-scrollbar-track{background:transparent}
  .q-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
  .q-list::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28);background-clip:padding-box}
  .q-row{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:12px;cursor:pointer;
    border:1px solid transparent}
  .q-row:hover{background:rgba(255,255,255,.06)}
  .q-row.on{background:linear-gradient(120deg, rgba(245,184,61,.16), rgba(245,184,61,.04));border-color:rgba(245,184,61,.28)}
  .q-row .cw{width:38px;height:38px;border-radius:9px;overflow:hidden;position:relative;flex:none}
  .q-row .cw .cch{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}
  .q-row .cw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
  .q-row .nm{min-width:0;flex:1}
  .q-row .nm b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q-row.on .nm b{color:var(--gold-2)}
  .q-row .nm span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q-row .du{font-size:11.5px;color:var(--ink-3)}

  /* ---------- toast ---------- */
  .toasts{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:99px;font-size:12.5px;
    color:var(--ink);background:rgba(12,17,28,.9);border:1px solid var(--stroke);box-shadow:0 12px 30px rgba(0,0,0,.5);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);animation:tin .24s ease}
  .toast i{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
  @keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

  /* ---------- mobile nav (unused on desktop, kept for narrow windows) ---------- */
  .mobilenav{display:none}

  /* ---------- jelly motion + like particles（对齐 D:\音乐 UI 毛玻璃版.html） ---------- */
  :root{--spring:cubic-bezier(.34,1.56,.64,1);--spring-soft:cubic-bezier(.34,1.35,.64,1)}
  @keyframes jellySquash{0%{transform:scale(1,1)}28%{transform:scale(1.14,.84)}48%{transform:scale(.9,1.1)}68%{transform:scale(1.05,.96)}84%{transform:scale(.98,1.02)}100%{transform:scale(1,1)}}
  @keyframes jellyPop{0%{transform:scale(1)}32%{transform:scale(1.38,.78)}55%{transform:scale(.82,1.18)}75%{transform:scale(1.12,.94)}100%{transform:scale(1)}}
  @keyframes jellyIn{0%{opacity:0;transform:scale(.88,1.06) translateY(10px)}55%{opacity:1;transform:scale(1.03,.97) translateY(-2px)}78%{transform:scale(.99,1.01) translateY(0)}100%{opacity:1;transform:scale(1,1) translateY(0)}}
  @keyframes jellyFloat{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}
  @keyframes heartBeat{0%,100%{transform:scale(1)}22%{transform:scale(1.18,.88)}44%{transform:scale(.92,1.1)}66%{transform:scale(1.06,.97)}}
  .nav-item,.tb-btn,.chip,.play-all,.more,.side-ctl,.op-btn,.speed,.flac,.load-more,.clear-search{
    transition:transform .45s var(--spring),background .18s,color .18s,border-color .18s,box-shadow .3s var(--spring-soft)}
  .nav-item:active,.tb-btn:active,.chip:active,.play-all:active,.more:active,.side-ctl:active,.load-more:active{
    animation:jellySquash .5s var(--spring)}
  .op-btn:active{animation:jellySquash .48s var(--spring)}
  .play-btn{transition:transform .5s var(--spring),filter .16s,box-shadow .3s}
  .play-btn:active{animation:jellyPop .55s var(--spring)}
  body.playing .play-btn{animation:jellyFloat 2.6s ease-in-out infinite}
  .card{transition:transform .5s var(--spring),box-shadow .4s var(--spring-soft)}
  .card:hover{transform:translateY(-5px) scale(1.015,.995)}
  .card:active{animation:jellySquash .55s var(--spring)}
  .row{position:relative;transition:background .16s,transform .45s var(--spring),border-color .18s}
  .row:active{transform:scale(.992,1.01)}
  .song .cwrap img,.now .disc,.ly-disc{transition:transform .5s var(--spring)}
  .row:hover .song .cwrap img{transform:scale(1.07) rotate(-1.5deg)}
  .op-btn.liked svg{animation:heartBeat .55s var(--spring)}
  .op-btn.like-burst{animation:jellyPop .55s var(--spring)}
  #nowLike.liked svg{animation:heartBeat .55s var(--spring)}
  .jelly-press{animation:jellySquash .5s var(--spring) !important}
  .jelly-pop{animation:jellyPop .58s var(--spring) !important}
  .cards .card{animation:jellyIn .6s var(--spring) both}
  .cards .card:nth-child(2){animation-delay:.06s}.cards .card:nth-child(3){animation-delay:.12s}.cards .card:nth-child(4){animation-delay:.18s}
  .panel.glass .row{animation:jellyIn .45s var(--spring) both}
  .panel.glass .row:nth-child(2){animation-delay:.03s}.panel.glass .row:nth-child(3){animation-delay:.06s}
  .panel.glass .row:nth-child(4){animation-delay:.09s}.panel.glass .row:nth-child(5){animation-delay:.12s}
  .panel.glass .row:nth-child(6){animation-delay:.15s}
  .progress .knob{transition:transform .35s var(--spring),opacity .15s}
  .progress:active .knob{transform:translate(-50%,-50%) scale(1.35,.85)}
  .search{transition:transform .45s var(--spring),border-color .18s,box-shadow .25s}
  .search:focus-within{transform:scale(1.01,.99);border-color:rgba(245,184,61,.35)}
  .sidebar{animation:jellyIn .55s var(--spring) both}
  .topbar{animation:jellyIn .55s var(--spring) .05s both}
  .player{animation:jellyIn .6s var(--spring) .08s both}
  .nav-item:hover{transform:translateX(2px) scale(1.01)}
  .op-btn:hover{transform:scale(1.12,.92)}
  .op-btn.liked:hover{transform:scale(1.15)}
  .ctl:hover{transform:scale(1.1,.94)}
  .brand-mark{transition:transform .5s var(--spring)}
  .brand:hover .brand-mark{transform:rotate(-6deg) scale(1.08,.94)}
  .now .disc:hover{transform:scale(1.05,.97)}
  /* 播放中行内的进度条 */
  .row-progress{position:absolute;left:14px;right:14px;bottom:5px;height:3px;border-radius:99px;
    background:rgba(255,255,255,.12);display:none;overflow:hidden}
  .row.playing .row-progress{display:block}
  .row-progress i{display:block;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--gold-2),#efa92c);transition:width .25s linear}
  /* 点赞粒子层 */
  #particleLayer{position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden}
  .like-particle{position:absolute;left:0;top:0;pointer-events:none;will-change:transform,opacity;display:grid;place-items:center}
  .like-particle svg{display:block;filter:drop-shadow(0 3px 8px rgba(255,93,115,.45))}
  .like-dot{border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .like-ring{border:2px solid rgba(255,93,115,.75);border-radius:50%;background:transparent}
  .like-plus{color:#ffcf6b;font-weight:900;line-height:1;text-shadow:0 2px 10px rgba(245,184,61,.6)}

  @media (max-width:1180px){ .lyrics{grid-template-columns:280px minmax(0,1fr)} }
  @media (max-width:760px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:900px){
    .lyrics{grid-template-columns:1fr}
    .ly-left{display:none}
  }
  @media (max-width:820px){
    .app{grid-template-columns:1fr;padding:10px 10px 196px}
    .sidebar{display:none}
    .topbar{padding:10px 12px}
    .tb-btn.back-fwd{display:none}
    .quality{display:none}
    .thead{display:none}
    .row{grid-template-columns:30px minmax(0,1fr) 52px 44px;min-height:60px}
    .album{display:none}
    .content{padding-top:16px}
    .player{left:10px;right:10px;bottom:76px;height:78px;grid-template-columns:minmax(0,1fr) auto;padding:0 12px;gap:8px}
    .player .now{gap:10px}
    .player .now .disc{width:48px;height:48px}
    .player #modeBtn,.player #nowLike{display:none}
    .player .controls{gap:2px}
    .player .ctl{width:38px;height:38px}
    .player .play-btn{width:48px;height:48px}
    .side-ctl{display:none}
    .time{display:none}
    .mobilenav{display:flex;position:fixed;left:10px;right:10px;bottom:10px;z-index:6;height:60px;
      border-radius:18px;padding:6px;gap:2px}
    .mobilenav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
      border-radius:13px;font-size:11px;color:var(--ink-2);min-height:48px}
    .mobilenav button svg{width:20px;height:20px}
    .mobilenav button.active{background:linear-gradient(120deg, rgba(245,184,61,.22), rgba(245,184,61,.08));color:var(--gold-2)}
  }
  @media (prefers-reduced-motion: reduce){
    .now .disc img,.ly-disc img,.eq i{animation:none}
    .cards .card,.panel.glass .row,.sidebar,.topbar,.player{animation:none}
    #particleLayer{display:none}
    *{transition:none !important}
  }
</style>
</head>

<!-- ============ 音质选择浮层 ============ -->
<div class="qpop" id="qpop" role="menu" aria-label="选择音质">
  <div class="qp-head">音质</div>
  <button class="qopt" data-q="128k" data-act="qpick" role="menuitem">
    <span class="qn"><b>标准 128K</b><small>体积小，省流量</small></span>
    <svg class="qk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg>
  </button>
  <button class="qopt" data-q="320k" data-act="qpick" role="menuitem">
    <span class="qn"><b>高品质 320K</b><small>推荐 · 均衡</small></span>
    <svg class="qk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg>
  </button>
  <button class="qopt" data-q="flac" data-act="qpick" role="menuitem">
    <span class="qn"><b>无损 FLAC</b><small>发烧级 · 部分音源需会员</small></span>
    <svg class="qk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg>
  </button>
</div>
<div class="qpop spop" id="spop" role="menu" aria-label="选择倍速">
  <div class="qp-head">播放倍速</div>
  <div class="sp-grid">
    <button class="sp-opt" data-v="0.5" data-act="spick" role="menuitem">0.5x</button>
    <button class="sp-opt" data-v="0.75" data-act="spick" role="menuitem">0.75x</button>
    <button class="sp-opt" data-v="1" data-act="spick" role="menuitem">1.0x</button>
    <button class="sp-opt" data-v="1.25" data-act="spick" role="menuitem">1.25x</button>
    <button class="sp-opt" data-v="1.5" data-act="spick" role="menuitem">1.5x</button>
    <button class="sp-opt" data-v="2" data-act="spick" role="menuitem">2.0x</button>
  </div>
</div>

<audio id="audio" preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
